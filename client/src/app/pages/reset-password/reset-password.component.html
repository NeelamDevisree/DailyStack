<div class="page">
  <div class="top">
    <div class="logo">DS</div>
    <h1 class="title">Reset Password</h1>
    <p class="sub">Enter your new password below.</p>
  </div>

  @if (success) {
    <div class="form">
      <div class="success-box">{{ success }}</div>
      <button class="btn-primary" (click)="goToLogin()">Back to Sign In</button>
    </div>
  } @else {
    <form class="form" (ngSubmit)="submit()">
      <div class="field">
        <label class="label">New Password</label>
        <input class="input" type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="min. 6 characters" required minlength="6" />
      </div>

      <div class="field">
        <label class="label">Confirm Password</label>
        <input class="input" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="re-enter password" required />
      </div>

      @if (error) {
        <div class="error-box">{{ error }}</div>
      }

      <button class="btn-primary" type="submit" [disabled]="loading || !token">
        {{ loading ? 'Resetting…' : 'Reset Password' }}
      </button>
      <button class="back-link" type="button" (click)="goToLogin()">← Back to Sign In</button>
    </form>
  }
</div>
